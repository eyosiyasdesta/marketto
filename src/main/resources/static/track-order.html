<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track Order - Marketto</title>
    <style>
      body {
        font-family: "Inter", sans-serif;
        max-width: 480px;
        margin: 0 auto;
        padding: 40px 24px;
        color: #1f2937;
        line-height: 1.6;
      }
      a.back {
        color: #2563eb;
        text-decoration: none;
        font-weight: 600;
      }
      h1 {
        font-size: 28px;
        margin-bottom: 8px;
      }
      .sub {
        color: #6b7280;
        margin-bottom: 24px;
      }
      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        box-sizing: border-box;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
      #result {
        margin-top: 24px;
      }
      .status {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 999px;
        background: #dbeafe;
        color: #1e3a8a;
        font-size: 13px;
        font-weight: 600;
      }
      .error {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <a
      class="back"
      href="index.html"
      onclick="
        window.close();
        return false;
      "
      >← Back to Marketto</a
    >
    <h1>Track Your Order</h1>
    <p class="sub">
      Enter your order number below. You must be signed in to Marketto.
    </p>

    <input id="orderId" type="text" placeholder="Order number, e.g. 42" />
    <button id="trackBtn">Track Order</button>

    <div id="result"></div>

    <script>
      document
        .getElementById("trackBtn")
        .addEventListener("click", async () => {
          const id = document.getElementById("orderId").value.trim();
          const resultEl = document.getElementById("result");
          resultEl.innerHTML = "";
          if (!id) return;

          const token = localStorage.getItem("sw_token");
          if (!token) {
            resultEl.innerHTML =
              '<p class="error">Please sign in to Marketto first, then come back to track your order.</p>';
            return;
          }

          try {
            const res = await fetch("/api/orders", {
              headers: { Authorization: "Bearer " + token },
            });
            if (!res.ok) throw new Error("Couldn't fetch orders.");
            const orders = await res.json();
            const order = orders.find((o) => String(o.id) === id);

            if (!order) {
              resultEl.innerHTML =
                '<p class="error">No order found with that number on your account.</p>';
              return;
            }

            resultEl.innerHTML = `
            <p><strong>Order #${order.id}</strong></p>
            <p><span class="status">${order.status}</span></p>
            <p>Shipping to: ${order.shippingAddress}</p>
            <p>Total: $${Number(order.totalAmount).toFixed(2)}</p>
          `;
          } catch (err) {
            resultEl.innerHTML =
              '<p class="error">Something went wrong. Please try again.</p>';
          }
        });
    </script>
  </body>
</html>
